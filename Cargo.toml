[package]
name = "acv"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Did the agent tell the truth? Local-only verification of AI coding agent sessions against git ground truth."
license = "MIT"
readme = "README.md"
repository = "https://github.com/chiragborse1/agent-claim-verifier"
keywords = ["ai", "agents", "codex", "claude", "verification", "audit"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "acv"
path = "src/main.rs"

[lib]
name = "acv"
path = "src/lib.rs"

# Deliberately minimal. The distribution promise is a zero-dependency single
# binary: every dep here is a build-time or stdlib-adjacent crate.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
