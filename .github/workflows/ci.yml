name: ci

on:
  push:
    branches: [main]
    # Tags must be listed explicitly: `branches` alone will not match a tag push,
    # which silently skips the release job.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The end-to-end tests create real git repos, so an identity must exist.
      - name: configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  release:
    name: release ${{ matrix.target }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Apple targets cannot be cross-compiled from Linux (no macOS SDK) and
        # *-pc-windows-msvc needs the MSVC toolchain, so each target is built on
        # the runner that owns its toolchain. Dropping a target here silently
        # ships a release with no binary for that platform.
        #
        # Only the three long-lived runners are used. macos-13, the last Intel
        # runner, was queueing for 12+ minutes and is being retired, but it is not
        # needed: Apple targets cross-compile between each other fine, so
        # macos-latest builds both macOS binaries.
        #
        # aarch64 linux uses the gnu target rather than musl because the runner has
        # aarch64-linux-gnu-gcc but no aarch64 musl cross-linker.
        include:
          - { runner: ubuntu-latest,  target: x86_64-unknown-linux-musl,   asset: acv-linux-x86_64 }
          - { runner: ubuntu-latest,  target: aarch64-unknown-linux-gnu,   asset: acv-linux-arm64 }
          - { runner: macos-latest,   target: aarch64-apple-darwin,       asset: acv-macos-arm64 }
          - { runner: macos-latest,   target: x86_64-apple-darwin,        asset: acv-macos-x86_64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc,    asset: acv-windows-x86_64.exe }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc,   asset: acv-windows-arm64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: collect
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/acv${{ endsWith(matrix.asset, '.exe') && '.exe' || '' }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum acv-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
