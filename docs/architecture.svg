<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="352" viewBox="0 0 1240 352" role="img" aria-label="acv pipeline: transcript and git repo into a verdict engine, out to a ranked report">
  <title>acv pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .h    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
              font-size: 11px; letter-spacing: 1.4px; fill: #6e7681; }
      .t    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
              font-size: 13.5px; fill: #e6edf3; }
      .s    { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
              font-size: 11.5px; fill: #8b949e; }
      .box  { fill: #010409; stroke: #30363d; }
      .wire { stroke: #6e7681; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1240" height="352" fill="#0d1117"/>

  <!-- stage headers -->
  <text class="h" x="40"  y="34">1 &#183; PARSE</text>
  <text class="h" x="780" y="34">3 &#183; VERDICT</text>
  <text class="h" x="1030" y="34">4 &#183; REPORT</text>
  <text class="h" x="40"  y="212">2 &#183; GIT GROUND TRUTH</text>

  <!-- inputs -->
  <rect class="box" x="40" y="48" width="190" height="62" rx="8"/>
  <text class="t" x="58" y="74">codex rollout</text>
  <text class="s" x="58" y="94">or claude transcript</text>

  <rect class="box" x="40" y="226" width="190" height="62" rx="8"/>
  <text class="t" x="58" y="252">repo @ baseline</text>
  <text class="s" x="58" y="272">session start commit</text>

  <!-- parse -->
  <rect class="box" x="280" y="48" width="180" height="62" rx="8" stroke="#1f6feb"/>
  <text class="t" x="298" y="74">codex.rs</text>
  <text class="s" x="298" y="94">claude.rs</text>

  <!-- git -->
  <rect class="box" x="280" y="226" width="180" height="62" rx="8" stroke="#1f6feb"/>
  <text class="t" x="298" y="252">git.rs</text>
  <text class="s" x="298" y="272">--name-status</text>

  <!-- wires into parse/git -->
  <path class="wire" d="M 230 79 H 272"/>
  <path class="wire" d="M 230 257 H 272"/>

  <!-- parse outputs -->
  <path class="wire" d="M 460 70 C 490 70, 490 60, 512 60"/>
  <path class="wire" d="M 460 90 C 490 90, 490 141, 512 141"/>

  <rect class="box" x="520" y="31" width="190" height="58" rx="8" stroke="#39c5cf"/>
  <text class="t" x="538" y="56">claim</text>
  <text class="s" x="538" y="74">the final message</text>

  <rect class="box" x="520" y="112" width="190" height="58" rx="8" stroke="#39c5cf"/>
  <text class="t" x="538" y="137">actions</text>
  <text class="s" x="538" y="155">calls, patches, exits</text>

  <!-- git output -->
  <path class="wire" d="M 460 257 H 512"/>
  <rect class="box" x="520" y="228" width="190" height="58" rx="8" stroke="#3fb950"/>
  <text class="t" x="538" y="253">changed files</text>
  <text class="s" x="538" y="271">with status per file</text>

  <!-- coverage note -->
  <text class="s" x="520" y="204">every stage reports what it did not understand</text>

  <!-- convergence into verdict -->
  <path class="wire" d="M 710 60 C 745 60, 745 130, 772 140"/>
  <path class="wire" d="M 710 141 H 772"/>
  <path class="wire" d="M 710 257 C 745 257, 745 190, 772 180"/>

  <rect class="box" x="780" y="100" width="200" height="160" rx="8" stroke="#d29922"/>
  <text class="t" x="800" y="128">verdict.rs</text>
  <text class="s" x="800" y="150">claim vs reality</text>
  <line x1="800" y1="162" x2="960" y2="162" stroke="#21262d"/>
  <text class="s" x="800" y="182">no-work</text>
  <text class="s" x="800" y="200">ended-on-failure</text>
  <text class="s" x="800" y="218">unmentioned-changes</text>
  <text class="s" x="800" y="236">no-verification</text>
  <text class="s" x="800" y="254">inconclusive</text>

  <path class="wire" d="M 980 180 H 1022"/>

  <rect class="box" x="1030" y="100" width="180" height="160" rx="8" stroke="#f85149"/>
  <text class="t" x="1050" y="128">ranked report</text>
  <text class="s" x="1050" y="150">by blast radius</text>
  <line x1="1050" y1="162" x2="1190" y2="162" stroke="#21262d"/>
  <text class="s" x="1050" y="182">CRITICAL</text>
  <text class="s" x="1050" y="200">HIGH</text>
  <text class="s" x="1050" y="218">MEDIUM</text>
  <text class="s" x="1050" y="236">LOW</text>
  <text class="s" x="1050" y="254">UNKNOWN</text>

  <!-- footer -->
  <text class="s" x="40" y="330">UNKNOWN is not a pass. Absence of a finding is not a clean bill of health.</text>
</svg>
